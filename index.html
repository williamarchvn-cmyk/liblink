<!doctype html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Thư viện Link</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='4' y='4' width='26' height='34' rx='9' fill='%23cdd6bd'/%3E%3Crect x='34' y='4' width='26' height='22' rx='9' fill='%23d9d3e9'/%3E%3Crect x='4' y='42' width='26' height='18' rx='8' fill='%23efe3b2'/%3E%3Crect x='34' y='30' width='26' height='30' rx='9' fill='%233c3d43'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#ffffff;--text:#111113;--muted:#77777e;--soft:#f1f1f3;--line:rgba(0,0,0,.07);--line2:rgba(0,0,0,.14);
  --card:#ececee;--sheet:#ffffff;--scrim:rgba(12,12,14,.36);--glass:rgba(255,255,255,.76);--danger:#e5484d;
  --pad:8px;--gap:8px;--r:18px;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);--sheet-ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0d0d0f;--text:#f1f1f3;--muted:#9a9aa3;--soft:#1c1c20;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.2);
  --card:#1c1c20;--sheet:#161619;--scrim:rgba(0,0,0,.55);--glass:rgba(13,13,15,.74);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
html{background:var(--bg);overscroll-behavior-y:contain;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:contain;transition:background-color .3s}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-user-select:none;user-select:none}
input{font:inherit;color:inherit}
svg{display:block;flex:none}
[hidden]{display:none!important}
button:focus-visible{outline:2px solid var(--text);outline-offset:2px}
input:focus,input:focus-visible{outline:none}

/* ---------- Brand banner ---------- */
.brand{max-width:1200px;margin:0 auto;padding:10px var(--pad) 12px}
.hero{position:relative;height:118px;border-radius:22px;overflow:hidden;isolation:isolate;transform:translateZ(0);
  background:linear-gradient(135deg,#252e5a,#12162f);box-shadow:0 16px 32px -20px rgba(22,28,72,.65);
  -webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;pointer-events:none;
  background:linear-gradient(90deg,rgba(13,16,38,.74) 0%,rgba(13,16,38,.4) 34%,rgba(13,16,38,0) 54%),
             linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,0) 40%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.mark{position:absolute;z-index:2;left:16px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-start;gap:7px;pointer-events:none}
.logo{display:block;width:59px;height:60px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.38))}
.by{font-size:11.5px;font-weight:400;letter-spacing:.03em;color:rgba(222,227,248,.62);white-space:nowrap;text-shadow:0 1px 6px rgba(10,13,32,.95),0 0 2px rgba(10,13,32,.8)}

/* ---------- Grid ---------- */
main{max-width:1200px;margin:0 auto;padding:2px var(--pad) 104px}
.grid{display:flex;align-items:flex-start;gap:var(--gap)}
.grid[data-c="3"],.grid[data-c="4"],.grid[data-c="5"],.grid[data-c="6"]{--r:14px}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column}
.card{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.cover{position:relative;display:block;width:100%;overflow:hidden;border-radius:var(--r);background:var(--card);
  container-type:inline-size;isolation:isolate;transform:translateZ(0);transition:transform .28s var(--ease),filter .28s var(--ease)}
.cover::after{content:"";position:absolute;inset:0;z-index:3;border-radius:inherit;box-shadow:inset 0 0 0 1px rgba(0,0,0,.035);pointer-events:none}
[data-theme=dark] .cover::after{box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.card.press .cover{transform:scale(.965);filter:brightness(.93)}
.card.go .cover{animation:go .5s var(--ease)}
.card.dbl .cover{animation:dbl .45s var(--ease)}
.card.in{animation:rise .55s var(--ease) both}
.card.pop{animation:pop .5s var(--spring) both}
.card.out{animation:out .24s ease forwards;pointer-events:none}
.card.lift .cover{transform:scale(1.035);filter:none;box-shadow:0 18px 36px -14px rgba(0,0,0,.38);transition:transform .25s var(--spring),box-shadow .25s}
.card.ghost{opacity:.3}
.card.ghost .cover{transform:scale(.95);filter:saturate(.6)}
.drag-clone{position:fixed!important;left:0;top:0;z-index:60;margin:0;pointer-events:none;will-change:transform}
.drag-clone .cover{box-shadow:0 26px 50px -14px rgba(0,0,0,.42);transition:none}
.drag-clone .meta{opacity:0}

.gen{position:absolute;inset:0;background:var(--c)}
.gen::before{content:"";position:absolute;inset:0;
  background:radial-gradient(75% 55% at var(--hx) var(--hy),var(--c1),transparent 72%),
             radial-gradient(85% 65% at calc(100% - var(--hx)) 100%,var(--c2),transparent 70%)}
.gen::after{content:"";position:absolute;inset:0;background-image:var(--noise);mix-blend-mode:overlay;opacity:.85;pointer-events:none}
.fav{position:absolute;z-index:1;left:50%;top:46%;transform:translate(-50%,-50%);width:clamp(34px,30cqw,60px);aspect-ratio:1;border-radius:30%;
  background:rgba(255,255,255,.66);box-shadow:0 10px 24px -8px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.9)}
.gen.dk .fav{background:rgba(255,255,255,.14);box-shadow:0 10px 24px -8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.18)}
.gen.dk .fav:has(.ico.has){background:rgba(255,255,255,.92)}
.ico{position:relative;display:grid;place-items:center;width:100%;height:100%}
.ico b{font-weight:600;line-height:1}
.ico img{position:absolute;inset:0;margin:auto;opacity:0;transition:opacity .3s}
.ico.has img{opacity:1}
.ico.has b{display:none}
.fav b{font-size:clamp(14px,12cqw,25px);color:var(--ink)}
.fav img{width:56%;height:56%;border-radius:18%}
.dom{position:absolute;z-index:1;left:10px;right:10px;bottom:clamp(7px,6cqw,12px);text-align:center;font-size:clamp(9px,6.2cqw,11px);
  font-weight:500;letter-spacing:.03em;color:var(--ink);opacity:.66;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pic{position:absolute;inset:0;z-index:1;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .45s var(--ease)}
.pic.ok{opacity:1}
.chip{position:absolute;z-index:2;left:8px;bottom:8px;width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.93);
  box-shadow:0 4px 12px -2px rgba(0,0,0,.25);opacity:0;transition:opacity .3s}
.pic.ok~.chip{opacity:1}
.chip b{font-size:13px;color:#222}
.chip img{width:16px;height:16px;border-radius:4px}
.pinm{position:absolute;z-index:2;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.92);color:#111;box-shadow:0 4px 10px -2px rgba(0,0,0,.22)}
.meta{display:flex;align-items:center;gap:2px;height:38px;padding:0 0 2px 4px}
.title{flex:1;min-width:0;font-size:13px;font-weight:500;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{flex:none;width:34px;height:30px;border-radius:10px;display:grid;place-items:center;transition:background-color .2s}
.more:active{background:var(--soft)}
.empty{display:none;place-items:center;min-height:62vh;color:var(--muted)}
.empty.on{display:grid}
.empty svg{opacity:.5;animation:float 4.5s ease-in-out infinite}

/* ---------- Glass FAB ---------- */
.fab{position:fixed;z-index:30;right:18px;bottom:16px;
  width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#141416;
  background:radial-gradient(120% 120% at 30% 18%,rgba(255,255,255,.55),rgba(255,255,255,.1) 55%,rgba(255,255,255,.22));
  -webkit-backdrop-filter:blur(14px) saturate(190%) contrast(1.06);backdrop-filter:blur(14px) saturate(190%) contrast(1.06);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 14px 34px -8px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.08),inset 0 1.5px 1px rgba(255,255,255,.95),
             inset 0 -7px 16px rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.12);
  opacity:0;transform:scale(.4) rotate(-90deg);
  transition:transform .55s var(--spring),opacity .3s}
.fab.ready{opacity:1;transform:none}
.fab.ready:active{transform:scale(.88);transition-duration:.18s}
.fab::before{content:"";position:absolute;left:10px;right:10px;top:4px;height:44%;border-radius:50% 50% 45% 45%/62% 62% 38% 38%;
  background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0));opacity:.75;pointer-events:none}
.fab::after{content:"";position:absolute;inset:-1px;border-radius:50%;padding:1.2px;pointer-events:none;
  background:conic-gradient(from 210deg,rgba(255,255,255,.95),rgba(255,255,255,.08) 25%,rgba(255,255,255,.55) 50%,rgba(255,255,255,.06) 75%,rgba(255,255,255,.95));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.fab svg{position:relative;z-index:1;filter:drop-shadow(0 1px 1px rgba(255,255,255,.7))}
[data-theme=dark] .fab{color:#fff;border-color:rgba(255,255,255,.24);
  background:radial-gradient(120% 120% at 30% 18%,rgba(255,255,255,.26),rgba(255,255,255,.04) 55%,rgba(255,255,255,.1))}
[data-theme=dark] .fab::before{opacity:.35}
[data-theme=dark] .fab svg{filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}

/* ---------- Scrim / Sheets ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}
.scrim.clear{background:transparent}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:calc(100dvh - 28px);
  display:flex;flex-direction:column;background:var(--sheet);border-radius:28px 28px 0 0;box-shadow:0 -12px 50px rgba(0,0,0,.18);
  transform:translateY(calc(100% + 40px));transition:transform .46s var(--sheet-ease);will-change:transform}
.sheet.on{transform:none}
.grab{flex:none;height:26px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:40px;height:5px;border-radius:5px;background:var(--line2)}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 18px 16px}
.sfoot{flex:none;display:flex;gap:10px;padding:10px 18px 14px;border-top:1px solid var(--line)}
#act .sbody{padding-bottom:20px}

/* Editor */
.etop{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;margin:4px 0 0}
.pv{width:96px;border-radius:16px;box-shadow:0 12px 26px -12px rgba(0,0,0,.35)}
.efields .f:last-child{margin-bottom:0}
.f{margin-bottom:14px}
.lbl{display:block;font-size:12.5px;font-weight:500;color:var(--muted);margin:0 2px 6px}
.inp{width:100%;height:46px;border:0;outline:0;border-radius:14px;background:var(--soft);padding:0 14px;font-size:16px;
  box-shadow:inset 0 0 0 1.5px transparent;transition:box-shadow .2s,background-color .2s}
.inp:focus{box-shadow:inset 0 0 0 1.5px var(--text);background:var(--sheet)}
.inp::placeholder{color:var(--muted);opacity:.7}
.f.err .inp{box-shadow:inset 0 0 0 1.5px var(--danger)}
.shake{animation:shake .42s}
.irow{position:relative}
.irow .inp{padding-right:46px}
.ib{position:absolute;right:4px;top:4px;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--muted)}
.ib:active{background:var(--line)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:-6px -18px 16px;padding:0 18px}
.chips::-webkit-scrollbar{display:none}
.chip2{flex:none;height:32px;padding:0 14px;border-radius:16px;background:var(--soft);font-size:13.5px;font-weight:500;transition:background-color .2s,color .2s,transform .2s var(--spring)}
.chip2:active{transform:scale(.94)}
.chip2.on{background:var(--text);color:var(--bg)}
.isrc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.isrc button{height:62px;border-radius:14px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  font-size:12px;font-weight:500;color:var(--muted);transition:background-color .2s,color .2s,transform .2s var(--spring)}
.isrc button:active{transform:scale(.95)}
.isrc button.on{background:var(--text);color:var(--bg)}
.iwrap{margin-top:8px;animation:fadeIn .25s}
.sw{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;transition:opacity .25s}
.sw.dim{opacity:.4}
.swb{aspect-ratio:1;max-width:34px;border-radius:50%;background:radial-gradient(circle at 30% 25%,var(--c1),var(--c) 58%,var(--c2));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);transition:transform .22s var(--spring),box-shadow .2s}
.swb:active{transform:scale(.85)}
.swb.on{box-shadow:0 0 0 2px var(--sheet),0 0 0 4px var(--text)}
.shp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shb{height:62px;border-radius:14px;background:var(--soft);display:grid;place-items:center;color:var(--muted);transition:background-color .2s,color .2s,transform .2s var(--spring)}
.shb:active{transform:scale(.95)}
.shb i{display:block;height:32px;border-radius:6px;border:1.8px solid currentColor}
.shb.on{background:var(--text);color:var(--bg)}
.bdel{flex:none;width:52px;height:52px;border-radius:16px;background:rgba(229,72,77,.1);color:var(--danger);display:grid;place-items:center;transition:transform .2s var(--spring)}
.bdel:active{transform:scale(.9)}
#ed:not(.editing) .bdel{display:none}
.bsave{flex:1;height:52px;border-radius:16px;background:var(--text);color:var(--bg);font-size:16px;font-weight:600;letter-spacing:.01em;transition:transform .2s var(--spring),opacity .2s}
.bsave:active{transform:scale(.97)}

/* Action sheet */
.ahead{display:flex;align-items:center;gap:12px;padding:4px 2px 16px}
.amini{flex:none;width:48px;height:48px;border-radius:14px}
.amini .dom{display:none}
.amini .fav{top:50%;width:70%}
.atext{min-width:0;flex:1}
.atitle{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aurl{margin-top:2px;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.aquick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.aquick button{height:76px;border-radius:18px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  font-size:12.5px;font-weight:500;transition:transform .2s var(--spring),background-color .2s}
.aquick button:active{transform:scale(.93);background:var(--line2)}
.alist{display:flex;flex-direction:column;border-radius:18px;overflow:hidden;background:var(--soft)}
.alist button{display:flex;align-items:center;gap:14px;height:54px;padding:0 18px;font-size:15px;font-weight:500;text-align:left;border-bottom:1px solid var(--line)}
.alist button:last-child{border-bottom:0}
.alist button:active{background:var(--line)}
.alist .danger{color:var(--danger)}

/* Toast */
.toast{position:fixed;z-index:70;left:16px;bottom:22px;max-width:calc(100% - 112px);height:48px;
  display:flex;align-items:center;gap:12px;padding:0 7px 0 18px;border-radius:24px;background:rgba(24,24,27,.86);color:#fff;font-size:14px;font-weight:500;
  -webkit-backdrop-filter:blur(16px) saturate(160%);backdrop-filter:blur(16px) saturate(160%);box-shadow:0 12px 30px -8px rgba(0,0,0,.42);
  transform:translateY(22px) scale(.96);opacity:0;pointer-events:none;transition:transform .36s var(--spring),opacity .25s}
.toast.on{transform:none;opacity:1;pointer-events:auto}
.toast.na{padding-right:18px}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{flex:none;height:34px;padding:0 14px;border-radius:17px;background:rgba(255,255,255,.16);color:#fff;font-size:13.5px;font-weight:600}
.toast button:active{background:rgba(255,255,255,.28)}

@media (hover:hover){
  .card:hover .cover{filter:brightness(.96)}
  .more:hover{background:var(--line2)}
}

@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}}
@keyframes pop{from{opacity:0;transform:scale(.86)}}
@keyframes out{to{opacity:0;transform:scale(.82)}}
@keyframes go{0%{transform:scale(.96)}55%{transform:scale(1.025)}100%{transform:none}}
@keyframes dbl{0%{transform:scale(.95)}45%{transform:scale(1.04)}100%{transform:none}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes float{50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<section class="brand" id="brand">
  <div class="hero" id="hkw">

  function drawRain(dt) {
    rc.setTransform(dpr, 0, 0, dpr, 0, 0); rc.clearRect(0, 0, W, H);
    rc.font = `${fs}px ${MONO}`; rc.textBaseline = 'top';
    for (let n = 0; n < cols.length; n++) {
      let c = cols[n];
      c.y += c.sp * dt;
      const head = Math.floor(c.y / fs);
      if ((head - c.len) * fs > H) { cols[n] = newCol(c.i, false); continue; }
      if (Math.random() < .08) c.ch[(Math.random() * c.ch.length) | 0] = glyph();
      for (let k = 0; k <= c.len; k++) {
        const row = head - k;
        if (row < 0) break;
        const y = row * fs; if (y > H) continue;
        const a = (1 - k / (c.len + 1)) * .8 * c.b;
        rc.fillStyle = k === 0
          ? (c.warm ? `rgba(255,196,150,${c.b.toFixed(3)})` : `rgba(228,233,255,${c.b.toFixed(3)})`)
          : (c.warm ? `rgba(255,150,95,${(a * .75).toFixed(3)})` : `rgba(135,155,255,${a.toFixed(3)})`);
        rc.fillText(c.ch[row % c.ch.length], c.x, y);
      }
    }
  }
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h); g.lineTo(x, y + h); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath();
  }
  function drawFigure(t) {
    fc.setTransform(dpr, 0, 0, dpr, 0, 0); fc.clearRect(0, 0, W, H);
    // typing rhythm: bursts of key presses with short pauses
    const burst = Math.sin(t * 1.05) + .35 * Math.sin(t * 2.7);
    const on = burst > -.55 ? 1 : .15;
    const kL = Math.max(0, Math.sin(t * 15.7)) * on, kR = Math.max(0, Math.sin(t * 12.9 + 1.9)) * on;
    const nod = Math.sin(t * 2.2) * .7 * u + (kL + kR) * .3 * u, sh = (kL + kR) * .3 * u;
    // body + arms
    fc.save(); fc.translate(0, sh);
    const g = fc.createLinearGradient(0, 36 * u, 0, H); g.addColorStop(0, '#222a52'); g.addColorStop(1, '#0b0e22');
    fc.fillStyle = g; fc.beginPath();
    fc.moveTo(cx - 12 * u, 38 * u);
    fc.bezierCurveTo(cx - 25 * u, 40 * u, cx - 37 * u, 45 * u, cx - 41 * u, 68 * u);
    fc.lineTo(cx + 41 * u, 68 * u);
    fc.bezierCurveTo(cx + 37 * u, 45 * u, cx + 25 * u, 40 * u, cx + 12 * u, 38 * u);
    fc.closePath(); fc.fill();
    fc.lineCap = 'round'; fc.strokeStyle = '#1a2146'; fc.lineWidth = 6.5 * u;
    const arm = (x1, y1, x2, y2) => { fc.beginPath(); fc.moveTo(x1, y1); fc.quadraticCurveTo(x1 + (x2 - x1) * .2, y2 - 1.5 * u, x2, y2); fc.stroke(); };
    arm(cx - 27 * u, 46 * u, cx - 14 * u, 54.5 * u - kL * 5 * u);
    arm(cx + 27 * u, 46 * u, cx + 14 * u, 54.5 * u - kR * 5 * u);
    fc.restore();
    // hood
    fc.save(); fc.translate(0, nod);
    const hg = fc.createLinearGradient(cx - 14 * u, 6 * u, cx + 14 * u, 44 * u); hg.addColorStop(0, '#2c3668'); hg.addColorStop(1, '#0d1129');
    fc.fillStyle = hg; fc.beginPath();
    fc.moveTo(cx - 14 * u, 44 * u);
    fc.bezierCurveTo(cx - 17.5 * u, 26 * u, cx - 11 * u, 6.5 * u, cx, 6 * u);
    fc.bezierCurveTo(cx + 11 * u, 6.5 * u, cx + 17.5 * u, 26 * u, cx + 14 * u, 44 * u);
    fc.closePath(); fc.fill();
    fc.fillStyle = '#04050d'; fc.beginPath(); fc.ellipse(cx, 27.5 * u, 7.2 * u, 10.5 * u, 0, 0, Math.PI * 2); fc.fill();
    const fl = .2 + .08 * Math.sin(t * 9.3) + .08 * (kL + kR);
    const gg = fc.createRadialGradient(cx, 37 * u, 0, cx, 37 * u, 11 * u);
    gg.addColorStop(0, `rgba(255,150,80,${fl.toFixed(3)})`); gg.addColorStop(1, 'rgba(255,150,80,0)');
    fc.fillStyle = gg; fc.beginPath(); fc.ellipse(cx, 30 * u, 7.2 * u, 10.5 * u, 0, 0, Math.PI * 2); fc.fill();
    fc.restore();
    // laptop lid (back side facing us)
    const lw = 56 * u, lx = cx - lw / 2, ly = 51 * u;
    const lg = fc.createLinearGradient(0, ly, 0, H); lg.addColorStop(0, '#141a3a'); lg.addColorStop(1, '#070a18');
    fc.fillStyle = lg; rr(fc, lx, ly, lw, H - ly + 2, 2.5 * u); fc.fill();
    fc.strokeStyle = 'rgba(255,175,120,.75)'; fc.lineWidth = .8 * u;
    fc.beginPath(); fc.moveTo(lx + 2.5 * u, ly + .4 * u); fc.lineTo(lx + lw - 2.5 * u, ly + .4 * u); fc.stroke();
    fc.fillStyle = `rgba(255,175,120,${(.55 + .2 * Math.sin(t * 3.1)).toFixed(3)})`;
    fc.font = `600 ${(5.2 * u).toFixed(2)}px ${MONO}`; fc.textAlign = 'center'; fc.textBaseline = 'middle';
    fc.fillText('</>', cx, ly + 7.2 * u); fc.textAlign = 'start';
    // code reflected over the figure
    fc.save(); fc.globalCompositeOperation = 'source-atop'; fc.globalAlpha = .22; fc.drawImage(rain, 0, 0, W, H); fc.restore();
  }
  function paint(dt) {
    if (!sized && !size()) return;
    t += dt;
    drawRain(dt);
    drawFigure(t);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const bg = ctx.createLinearGradient(0, 0, W, H); bg.addColorStop(0, '#252e5a'); bg.addColorStop(1, '#12162f');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    const hl = ctx.createRadialGradient(cx, 30 * u, 0, cx, 30 * u, 62 * u);
    hl.addColorStop(0, 'rgba(120,135,255,.26)'); hl.addColorStop(1, 'rgba(120,135,255,0)');
    ctx.fillStyle = hl; ctx.fillRect(0, 0, W, H);
    off = (off + dt * 10 * H / 60) % L;
    ctx.drawImage(bgl, 0, off - L, W, L); ctx.drawImage(bgl, 0, off, W, L);
    ctx.drawImage(rain, 0, 0, W, H);
    const vg = ctx.createRadialGradient(cx, 40 * u, 4 * u, cx, 40 * u, 40 * u);
    vg.addColorStop(0, 'rgba(10,13,32,.72)'); vg.addColorStop(1, 'rgba(10,13,32,0)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ctx.save();
    ctx.shadowColor = 'rgba(150,170,255,.85)'; ctx.shadowBlur = 6 * dpr; ctx.drawImage(fig, 0, 0, W, H);
    ctx.shadowColor = 'rgba(255,160,100,.4)'; ctx.shadowBlur = 2 * dpr; ctx.drawImage(fig, 0, 0, W, H);
    ctx.restore();
  }
  function frame(now) {
    raf = 0;
    if (!running) return;
    if (now - last < 28) { raf = requestAnimationFrame(frame); return; }
    const dt = Math.min(.06, (now - last) / 1000); last = now;
    paint(dt);
    raf = requestAnimationFrame(frame);
  }
  function start() { if (running) return; running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
  function stop() { running = false; if (raf) cancelAnimationFrame(raf); raf = 0; }
  function update() { if (inView && !doc.hidden && !reduce) start(); else stop(); }
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { inView = es[0].isIntersecting; update(); }).observe(wrap);
  doc.addEventListener('visibilitychange', update);
  let lastW = 0;
  return {
    init() { if (size()) { lastW = W; paint(.016); } update(); },
    resize() { const w = cv.getBoundingClientRect().width; if (Math.abs(w - lastW) > 1 && size()) { lastW = W; paint(0); } }
  };
})();

/* ---------- misc ---------- */
fab.addEventListener('click', () => openEditor(null));
let lw = innerWidth, rzT = 0;
addEventListener('resize', () => {
  clearTimeout(rzT);
  rzT = setTimeout(() => {
    if (innerWidth !== lw) { lw = innerWidth; render(); }
    Hacker && Hacker.resize();
  }, 120);
});

/* ---------- init ---------- */
async function init() {
  load(); applyTheme(); makeNoise();
  $$('[data-ic]').forEach(el => el.insertAdjacentHTML('afterbegin', ic(el.dataset.ic, +el.dataset.s || 22, +el.dataset.w || 1.8)));
  buildEditor();
  draggable(act); draggable(ed);
  if (!navigator.share) $('#aShare').hidden = true;
  if (!(navigator.clipboard && navigator.clipboard.readText)) $('#paste').hidden = true;
  const opening = DB.open();
  const ok = await Promise.race([opening, new Promise(r => setTimeout(() => r(false), 700))]);
  if (ok) (await DB.all()).forEach(([k, v]) => imgs.set(k, v));
  else opening.then(async o => { if (o) { (await DB.all()).forEach(([k, v]) => imgs.set(k, v)); render(); } });
  render('enter');
  Hacker && Hacker.init();
  requestAnimationFrame(() => fab.classList.add('ready'));
}
init();
})();
</script>
